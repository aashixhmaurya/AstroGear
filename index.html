<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astro Gears Simulation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/OBJExporter.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="flex h-screen w-full overflow-hidden">

    <div id="ui-panel" class="te-bg flex flex-col z-10 h-full relative shadow-2xl shrink-0" style="width: 460px;">
        <div class="flex-1 w-full h-full overflow-y-auto flex flex-col">

            <div class="px-10 py-10 border-b border-white/30 shrink-0">
                <div class="flex items-baseline gap-3">
                    <h1 class="text-6xl font-light tracking-wide leading-none uppercase">Astro</h1>
                    <h1 class="text-6xl font-light tracking-wide text-white/70 leading-none uppercase">Gears</h1>
                </div>
                <p class="mt-2 text-lg font-light text-white/90 tracking-widest uppercase">Dynamic Simulator</p>
            </div>

            <div class="px-10 py-6 flex flex-col flex-1">
                <div id="collision-warning" style="display: none;"
                    class="bg-white text-[#D52B2A] border border-white p-4 mb-6 flex items-start gap-4 transition-opacity shrink-0">
                    <span class="text-3xl font-bold mt-[-4px]">!</span>
                    <div class="text-[1.05rem] leading-tight font-medium">
                        <strong class="block text-xl font-bold mb-1 uppercase">System Jammed!</strong>
                        <span id="warning-text">Gears are physically overlapping or conflicting in a mesh loop. Please
                            adjust the layout.</span>
                    </div>
                </div>

                <div class="mt-[-10px] shrink-0">
                    <div class="section-title">Animation Controls</div>
                    <div class="flex gap-3 mb-6">
                        <button id="btn-toggle" class="ui-btn flex-1">Start / Stop</button>
                        <button id="btn-freeze" class="ui-btn flex-1">Freeze</button>
                        <button id="btn-reset"
                            class="ui-btn flex-1 !border-white/30 hover:!border-white/80">Reset</button>
                    </div>
                    <div class="property-row">
                        <label class="property-label">System Speed (RPM):</label>
                        <div class="property-control">
                            <input type="number" id="input-base-rpm" value="10" class="ui-input !w-24 text-center">
                        </div>
                    </div>
                    <div class="property-row">
                        <label class="property-label">Main Gear Direction:</label>
                        <div class="property-control">
                            <select id="input-base-direction" class="ui-input !w-24 text-center !px-1">
                                <option value="1">CW</option>
                                <option value="-1">CCW</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="shrink-0">
                    <div class="section-title flex items-center justify-between !border-none !mb-4">
                        <span>Gear Hierarchy</span>
                        <div class="flex gap-3">
                            <button id="btn-add" class="ui-btn !py-1 !px-3 !text-sm">+ Add New</button>
                            <button id="btn-remove" class="ui-btn !py-1 !px-3 !text-sm">- Remove</button>
                        </div>
                    </div>
                    <div id="gear-list" class="flex flex-col mb-4 max-h-56 overflow-y-auto pr-2"></div>
                </div>

                <div id="panel-connection" class="transition-opacity shrink-0">
                    <div class="section-title">Connection Properties</div>
                    <div class="property-row">
                        <label class="property-label">Parent Gear #:</label>
                        <div class="property-control">
                            <select id="input-parent" class="ui-input !w-24"></select>
                        </div>
                    </div>
                    <div class="property-row">
                        <label class="property-label">Axle Connection:</label>
                        <div class="property-control justify-end w-full"><input type="checkbox" id="input-axle"></div>
                    </div>
                    <div class="property-row">
                        <label class="property-label">Connection Angle:</label>
                        <div class="property-control">
                            <span class="ui-btn-small" onclick="stepValue('input-angle', -15)">–</span>
                            <input type="number" id="input-angle" value="0" class="ui-input !w-16 text-center !px-1">
                            <span class="ui-btn-small" onclick="stepValue('input-angle', 15)">+</span>
                        </div>
                    </div>
                    <div class="property-row">
                        <label class="property-label">Auto Position:</label>
                        <div class="property-control justify-end w-full"><input type="checkbox" id="input-auto-pos"
                                checked></div>
                    </div>
                    <div class="property-row transition-opacity" id="manual-pos-wrapper">
                        <label class="property-label">X / Y Position (Manual):</label>
                        <div class="property-control">
                            <input type="number" id="input-pos-x" step="0.5" class="ui-input !w-16 text-center !px-1">
                            <input type="number" id="input-pos-y" step="0.5" class="ui-input !w-16 text-center !px-1">
                        </div>
                    </div>
                </div>

                <div id="panel-properties" class="transition-opacity shrink-0">
                    <div class="section-title">Gear Properties</div>
                    <div class="property-row">
                        <label class="property-label">Number of Teeth (N):</label>
                        <div class="property-control">
                            <span class="ui-btn-small" onclick="stepValue('input-teeth', -1)">–</span>
                            <input type="number" id="input-teeth" value="16" min="6" step="1"
                                class="ui-input !w-16 text-center !px-1">
                            <span class="ui-btn-small" onclick="stepValue('input-teeth', 1)">+</span>
                        </div>
                    </div>
                    <div class="property-row">
                        <label class="property-label">Diametral Pitch (P):</label>
                        <div class="property-control">
                            <input type="number" id="input-pitch" min="0.5" step="0.5"
                                class="ui-input !w-24 text-center">
                        </div>
                    </div>
                    <div class="property-row opacity-80 mt-4 border-t border-white/30 pt-4">
                        <label class="property-label">Pitch Diameter (D):</label>
                        <div class="property-control">
                            <input type="number" id="input-pitch-dia" step="0.1" class="ui-input !w-24 text-center"
                                readonly disabled>
                        </div>
                    </div>
                    <div class="property-row mt-2">
                        <label class="property-label">Pressure Angle (PA):</label>
                        <div class="property-control">
                            <span class="ui-btn-small" onclick="stepValue('input-pa', -1)">–</span>
                            <input type="number" id="input-pa" value="20" min="10" max="60" step="1"
                                class="ui-input !w-16 text-center !px-1">
                            <span class="ui-btn-small" onclick="stepValue('input-pa', 1)">+</span>
                        </div>
                    </div>
                </div>

                <div class="mb-10 shrink-0">
                    <div class="section-title">Display Options</div>
                    <div class="property-row">
                        <label class="property-label">Show Gear Labels:</label>
                        <div class="property-control justify-end w-full"><input type="checkbox" id="toggle-labels"
                                checked></div>
                    </div>
                    <div class="mt-8 flex gap-3">
                        <button class="ui-btn flex-1" onclick="mockDownload('obj')">Download 3D OBJ</button>
                        <button class="ui-btn flex-1 !border-white/30 hover:!border-white/80" id="btn-clear-all">Reset
                            All</button>
                    </div>
                </div>
            </div>
        </div>
        <div id="panel-resizer"
            class="absolute top-0 right-0 w-[6px] h-full cursor-col-resize hover:bg-white/20 transition-colors group flex items-center justify-center z-50">
            <div class="w-[2px] h-12 bg-white/40 rounded-full opacity-0 group-hover:opacity-100 transition-opacity">
            </div>
        </div>
    </div>

    <div id="canvas-wrapper" class="flex-1 min-w-0">
        <div id="canvas-container"></div>
        <div id="labels-container"></div>

        <div id="telemetry-panel"
            class="absolute top-3 right-3 w-48 te-bg border border-white/30 shadow-2xl flex-col z-40 hidden pointer-events-none">
            <div class="px-2 py-1 border-b border-white/30 bg-black/10">
                <span class="text-[1.1rem] font-medium tracking-widest uppercase text-white">Live Telemetry</span>
            </div>
            <div id="telemetry-content"
                class="px-2 py-1.5 flex flex-col text-[0.95rem] font-light text-white/90 uppercase tracking-wider">
            </div>
        </div>

        <div class="absolute bottom-4 left-4 flex flex-col items-center gap-3 z-50">
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="edit-mode-toggle" class="sr-only peer">
                <div
                    class="w-14 h-7 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-[#D52B2A] shadow-xl border border-slate-400 peer-checked:border-[#b02222]">
                </div>
            </label>
            <span
                class="text-[12px] font-bold text-slate-800 bg-white/90 px-3 py-1.5 rounded shadow-sm uppercase tracking-widest border border-slate-200"
                style="font-family: 'Saira Extra Condensed', sans-serif;">edit mode</span>
        </div>
    </div>

    <div style="display: none;"
        class="opacity-90 opacity-70 hidden flex border-b border-white/15 py-0.5 pt-0.5 text-white/60 text-[0.85rem] font-medium text-white uppercase tracking-wider">
    </div>

    <script src="script.js"></script>
</body>

</html>
